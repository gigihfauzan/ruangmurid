<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a73e8">
  <title>Catatan Harian 7KAIH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/app.css?v=8">
</head>
<body>
  <div id="app"></div>
  <div id="toast" aria-live="polite"></div>
  <noscript><p style="padding:24px">Aplikasi ini membutuhkan JavaScript. Aktifkan JavaScript di browser Anda.</p></noscript>
  <script>
    // Galat tampilan: pesan ramah untuk pengguna, rincian hanya di konsol browser.
    window.addEventListener('error', function (e) {
      if (window.console) console.error(e.message, e.filename, e.lineno);
      var box = document.getElementById('toast');
      if (!box || window.__errShown) return;
      window.__errShown = true;
      var d = document.createElement('div');
      d.className = 'toast err';
      d.textContent = 'Terjadi masalah pada tampilan. Muat ulang halaman. Jika berulang, hubungi admin.';
      box.appendChild(d);
      setTimeout(function () { d.remove(); window.__errShown = false; }, 12000);
    });
  </script>
  <script src="assets/config.js?v=8"></script>
  <script src="assets/api.js?v=8"></script>
  <script src="assets/ui.js?v=8"></script>
  <script src="assets/auth.js?v=8"></script>
  <script src="assets/shell.js?v=8"></script>
  <script src="assets/student.js?v=8"></script>
  <script src="assets/teacher.js?v=8"></script>
  <script src="assets/admin.js?v=8"></script>
  <script src="assets/reader.js?v=8"></script>
  <script src="assets/backup.js?v=8"></script>
  <script src="assets/app.js?v=8"></script>
</body>
</html>
