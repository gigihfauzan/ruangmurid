<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Jurnal 7KAIH SMP</title>
  <style>
    :root {
      --primary: #0f766e;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --ok-bg: #dcfce7;
      --ok-text: #166534;
      --warn-bg: #fef3c7;
      --warn-text: #92400e;
      --err-bg: #fee2e2;
      --err-text: #991b1b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 16px;
    }
    .container {
      max-width: 560px;
      margin: 24px auto;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      background: #ccfbf1;
      color: #0f766e;
      margin-bottom: 12px;
    }
    h1 { font-size: 22px; margin-bottom: 4px; color: var(--primary); }
    .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 20px; }
    .status-box {
      padding: 14px;
      border-radius: 12px;
      font-size: 14px;
      margin-bottom: 16px;
      background: #f1f5f9;
      border: 1px solid var(--border);
    }
    .status-ok { background: var(--ok-bg); color: var(--ok-text); border-color: #bbf7d0; }
    .status-warn { background: var(--warn-bg); color: var(--warn-text); border-color: #fde68a; }
    .status-err { background: var(--err-bg); color: var(--err-text); border-color: #fecaca; }
    .meta-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }
    .meta-item {
      background: #f8fafc;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    .meta-label { font-size: 11px; color: var(--muted); text-transform: uppercase; }
    .meta-val { font-size: 14px; font-weight: 600; margin-top: 2px; }
    button {
      width: 100%;
      min-height: 48px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 12px;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <span class="badge" id="modeBadge">Fondasi Sistem • Tahap 1</span>
      <h1 id="appTitle">Jurnal 7KAIH SMP</h1>
      <p class="subtitle" id="schoolTitle">Memuat identitas sekolah...</p>

      <div id="statusBox" class="status-box">
        Memeriksa koneksi server dan kesiapan database...
      </div>

      <div class="meta-grid">
        <div class="meta-item">
          <div class="meta-label">Tanggal Server (WIB)</div>
          <div class="meta-val" id="serverDate">-</div>
        </div>
        <div class="meta-item">
          <div class="meta-label">Zona Waktu</div>
          <div class="meta-val" id="serverTz">-</div>
        </div>
      </div>

      <button id="btnRecheck" onclick="checkFoundation()">Periksa Ulang Koneksi</button>
    </div>
  </div>

  <script>
    /**
     * KONFIGURASI BACKEND API:
     * - Biarkan kosong ('') jika file HTML ini dibuka langsung dari Google Apps Script.
     * - Isi dengan URL Web App Apps Script (berakhiran /exec) jika file ini di-host di GitHub Pages / Custom Domain.
     */
    const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbx6Ga95-A1doT5p9jhrYzqOMHGk1ILgOCmKOWG2b9a7mPefsUvWe25ETTlz92gXoEwB3g/exec';

    /**
     * Penghubung API universal: otomatis memilih google.script.run atau fetch() ke GAS_API_URL.
     */
    function callApi(payload) {
      return new Promise(function(resolve, reject) {
        const isInsideGas = (typeof google !== 'undefined' && google.script && google.script.run);
        if (isInsideGas && !GAS_API_URL) {
          google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(reject)
            .apiRouter(payload);
          return;
        }

        if (!GAS_API_URL) {
          reject(new Error('GAS_API_URL belum diisi untuk mode hosting eksternal (GitHub Pages).'));
          return;
        }

        fetch(GAS_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        })
          .then(function(resp) {
            if (!resp.ok) throw new Error('HTTP ' + resp.status);
            return resp.json();
          })
          .then(resolve)
          .catch(reject);
      });
    }

    async function checkFoundation() {
      const box = document.getElementById('statusBox');
      const btn = document.getElementById('btnRecheck');
      btn.disabled = true;
      box.className = 'status-box';
      box.textContent = 'Menghubungi server Google Apps Script...';

      try {
        const [pingRes, cfgRes] = await Promise.all([
          callApi({ action: 'PING' }),
          callApi({ action: 'GET_PUBLIC_CONFIG' })
        ]);

        if (cfgRes && cfgRes.ok && cfgRes.data) {
          const cfg = cfgRes.data;
          document.getElementById('appTitle').textContent = cfg.nama_aplikasi || 'Jurnal 7KAIH SMP';
          document.getElementById('schoolTitle').textContent = cfg.nama_sekolah || '';
          document.title = (cfg.nama_aplikasi || 'Jurnal 7KAIH') + ' - ' + (cfg.nama_sekolah || '');
          if (cfg.warna_tema) {
            document.documentElement.style.setProperty('--primary', cfg.warna_tema);
          }
        }

        if (!pingRes || !pingRes.ok) {
          box.className = 'status-box status-err';
          box.textContent = (pingRes && pingRes.message) ? pingRes.message : 'Gagal terhubung ke server.';
          return;
        }

        document.getElementById('serverDate').textContent = pingRes.serverTime || '-';
        document.getElementById('serverTz').textContent = pingRes.data.timezone || '-';

        if (pingRes.data.status === 'SIAP') {
          box.className = 'status-box status-ok';
          box.textContent = 'Database siap (' + pingRes.data.totalSheetsRequired + ' tabel terverifikasi). Koneksi API berjalan normal.';
        } else {
          box.className = 'status-box status-warn';
          box.textContent = 'Database belum lengkap. Sheet belum ada: ' + pingRes.data.missingSheets.join(', ');
        }
      } catch (err) {
        box.className = 'status-box status-err';
        box.textContent = 'Kesalahan jaringan/server: ' + (err && err.message ? err.message : err);
      } finally {
        btn.disabled = false;
      }
    }

    window.addEventListener('DOMContentLoaded', checkFoundation);
  </script>
</body>
</html>
