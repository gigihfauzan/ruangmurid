<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title><?= appName ?> - <?= schoolName ?></title>
  <style>
    :root {
      --primary: <?= themeColor ?>;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --ok-bg: #dcfce7;
      --ok-text: #166534;
      --warn-bg: #fef3c7;
      --warn-text: #92400e;
      --err-bg: #fee2e2;
      --err-text: #991b1b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 16px;
    }
    .container {
      max-width: 560px;
      margin: 24px auto;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      background: #ccfbf1;
      color: #0f766e;
      margin-bottom: 12px;
    }
    h1 { font-size: 22px; margin-bottom: 4px; color: var(--primary); }
    .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 20px; }
    .status-box {
      padding: 14px;
      border-radius: 12px;
      font-size: 14px;
      margin-bottom: 16px;
      background: #f1f5f9;
      border: 1px solid var(--border);
    }
    .status-ok { background: var(--ok-bg); color: var(--ok-text); border-color: #bbf7d0; }
    .status-warn { background: var(--warn-bg); color: var(--warn-text); border-color: #fde68a; }
    .status-err { background: var(--err-bg); color: var(--err-text); border-color: #fecaca; }
    .meta-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }
    .meta-item {
      background: #f8fafc;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    .meta-label { font-size: 11px; color: var(--muted); text-transform: uppercase; }
    .meta-val { font-size: 14px; font-weight: 600; margin-top: 2px; }
    button {
      width: 100%;
      min-height: 48px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <span class="badge">Fondasi Sistem • Tahap 1</span>
      <h1 id="appTitle"><?= appName ?></h1>
      <p class="subtitle" id="schoolTitle"><?= schoolName ?></p>

      <div id="statusBox" class="status-box">
        Memeriksa koneksi server dan kesiapan database...
      </div>

      <div class="meta-grid">
        <div class="meta-item">
          <div class="meta-label">Tanggal Server (WIB)</div>
          <div class="meta-val" id="serverDate">-</div>
        </div>
        <div class="meta-item">
          <div class="meta-label">Zona Waktu</div>
          <div class="meta-val" id="serverTz">-</div>
        </div>
      </div>

      <button id="btnRecheck" onclick="checkFoundation()">Periksa Ulang Koneksi</button>
    </div>
  </div>

  <script>
    function checkFoundation() {
      const box = document.getElementById('statusBox');
      const btn = document.getElementById('btnRecheck');
      btn.disabled = true;
      box.className = 'status-box';
      box.textContent = 'Menghubungi server Google Apps Script...';

      google.script.run
        .withSuccessHandler(function(res) {
          btn.disabled = false;
          if (!res || !res.ok) {
            box.className = 'status-box status-err';
            box.textContent = (res && res.message) ? res.message : 'Gagal terhubung ke server.';
            return;
          }
          document.getElementById('serverDate').textContent = res.serverTime || '-';
          document.getElementById('serverTz').textContent = res.data.timezone || '-';

          if (res.data.status === 'SIAP') {
            box.className = 'status-box status-ok';
            box.textContent = 'Database siap (' + res.data.totalSheetsRequired + ' tabel terverifikasi). Fondasi Tahap 1 berjalan normal.';
          } else {
            box.className = 'status-box status-warn';
            box.textContent = 'Database belum lengkap. Sheet belum ada: ' + res.data.missingSheets.join(', ') + '. Jalankan setupDatabase() di Apps Script.';
          }
        })
        .withFailureHandler(function(err) {
          btn.disabled = false;
          box.className = 'status-box status-err';
          box.textContent = 'Kesalahan jaringan/server: ' + (err && err.message ? err.message : err);
        })
        .apiRouter({ action: 'PING' });
    }

    window.addEventListener('DOMContentLoaded', checkFoundation);
  </script>
</body>
</html>
